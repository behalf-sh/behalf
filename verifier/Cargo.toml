[package]
name = "behalf-verify"
version = "0.1.2"
edition = "2021"
description = "Offline verifier for behalf action-receipt exports: record integrity and delegation-chain checks, no network, no account"
license = "Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/behalf-sh/behalf"
homepage = "https://behalf.sh"
readme = "README.md"
keywords = ["audit", "receipts", "verification", "agents", "transparency-log"]
categories = ["command-line-utilities", "cryptography", "authentication"]
# The browser build's inputs and outputs are not part of the crate; the
# published crate is the CLI and the library it is built from.
exclude = ["web/", "target/"]

[lib]
name = "behalf_verify"
# `cdylib` is the wasm32 artifact wasm-bindgen post-processes; `rlib` is what
# the CLI binary and the native test suite link against. Both are always
# declared — on native targets the cdylib is an unused extra artifact, and the
# binary's behaviour is unaffected.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "behalf-verify"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Used only by the vendored tlog_core module (native builds); see below.
thiserror = "2"

# The RFC 6962 Merkle math is vendored from cloudflare/azul at a pinned SHA
# (see vendor/azul/VENDOR.md) and compiled into this crate as a module —
# `src/vendored_tlog_core.rs` is a `#[path]` include of the verbatim upstream
# source. It used to be a path dependency, which crates.io does not accept;
# azul itself is unpublished on crates.io (cloudflare/azul#16). Native-only:
# log-directory mode needs a filesystem and is not part of the wasm surface.

# Wasm-only: the browser shim. Nothing here is resolved for native builds, so
# `cargo build`/`test`/`clippy` on the CLI never see wasm-bindgen at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Size-tuned profile for the browser artifact only. A custom profile leaves
# `release` — and therefore the native `behalf-verify` binary — untouched.
# `panic = "abort"` is safe here because the wasm surface never panics on
# untrusted bytes by construction (see src/wasm.rs).
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
